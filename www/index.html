<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1E17">
<title>Darts</title>
<meta name="description" content="Darts scorer: X01, Cricket and practice games">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
@font-face{font-family:'FrcCond';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/barlow-condensed-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'FrcCond';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/barlow-condensed-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'FrcCond';font-style:normal;font-weight:800;font-display:swap;src:url('fonts/barlow-condensed-latin-800-normal.woff2') format('woff2')}
@font-face{font-family:'FrcBody';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/barlow-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'FrcBody';font-style:normal;font-weight:500;font-display:swap;src:url('fonts/barlow-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'FrcBody';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/barlow-latin-600-normal.woff2') format('woff2')}
:root{
  --bg:#E6EBE2;--surf:#FFFFFF;--surf2:#F1F4EE;--line:#C6D0C2;--text:#13241B;--muted:#56685B;
  --red:#C3322A;--green:#1D8549;--brass:#94701A;--on-accent:#FFFFFF;--sisal:#E7DCC0;--wire:#1B1B17;
  --fc:'FrcCond','Barlow Condensed','Roboto Condensed','Arial Narrow',system-ui,sans-serif;
  --fb:'FrcBody','Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1E17;--surf:#172B22;--surf2:#1C3329;--line:#2C4A3B;--text:#F0EADB;--muted:#9EB1A2;
    --red:#E5493F;--green:#43B870;--brass:#D9B44C;--on-accent:#0F1E17;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1E17;--surf:#172B22;--surf2:#1C3329;--line:#2C4A3B;--text:#F0EADB;--muted:#9EB1A2;
  --red:#E5493F;--green:#43B870;--brass:#D9B44C;--on-accent:#0F1E17;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:400 16px/1.45 var(--fb);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.page{flex:1;overflow-y:auto;padding:16px 16px 28px;min-height:0;scroll-padding-bottom:96px}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5}
.top h2{font:700 21px/1.1 var(--fc);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{min-width:44px;height:42px;border-radius:10px;display:grid;place-items:center;font:700 17px var(--fc);padding:0 12px;border:1px solid var(--line);background:var(--surf)}
.ib:disabled{opacity:.4}
.btn{display:block;width:100%;padding:14px 16px;border-radius:12px;font:700 21px/1.1 var(--fc);background:var(--surf);border:1px solid var(--line);text-align:center}
.btn.primary{background:var(--green);color:var(--on-accent);border-color:transparent}
.btn.danger{color:var(--red);border-color:var(--red);background:transparent}
.btn:disabled{opacity:.45}
.btn+.btn{margin-top:10px}
.muted{color:var(--muted)}
.lbl{font:600 15px var(--fb);color:var(--muted);margin:20px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:var(--surf);font:600 18px/1.2 var(--fc)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.scroller{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scroller .chip{white-space:nowrap}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surf);overflow:hidden}
.step button{width:48px;height:44px;font:700 24px var(--fc)}
.step b{min-width:56px;text-align:center;font:700 24px var(--fc)}
.steps{display:flex;gap:16px;flex-wrap:wrap}
.steps>div>span{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}

/* home */
.hero{display:flex;align-items:center;gap:18px;padding:22px 2px 26px}
.hero svg{width:clamp(84px,26vw,118px);height:auto;aspect-ratio:1;flex:none}
.hero>div{min-width:0}
.hero h1{font:800 clamp(36px,10.5vw,66px)/.9 var(--fc);letter-spacing:-.5px;white-space:nowrap}
.hero p{color:var(--muted);margin-top:8px;font-size:15px;max-width:22ch}
.resume{background:var(--surf);border:1px solid var(--brass);border-radius:14px;padding:14px;margin-bottom:12px}
.resume b{font:700 21px var(--fc);display:block}
.resume .btn{margin-top:10px}
.menu{margin-top:18px;border-top:1px solid var(--line)}
.menu button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px 4px;border-bottom:1px solid var(--line);font:600 22px var(--fc);text-align:left}
.menu button span{font:500 15px var(--fb);color:var(--muted)}

/* setup */
.prow{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surf);margin-bottom:8px;text-align:left;font:600 20px var(--fc)}
.ord{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:700 17px var(--fc);flex:none}
.prow.on{border-color:var(--brass)}
.prow.on .ord{background:var(--brass);border-color:var(--brass);color:var(--on-accent)}
.addrow{display:flex;gap:8px;margin-top:4px}
.addrow input,.field{flex:1;min-width:0;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surf);font-size:17px}
.addrow .ib{height:auto}
.toggle{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 2px;border-bottom:1px solid var(--line);text-align:left;font-size:17px;gap:12px}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surf);transition:transform .15s}
.toggle.on .sw{background:var(--green)}
.toggle.on .sw::after{transform:translateX(20px)}
.startbar{position:sticky;bottom:0;padding:12px 0 4px;background:var(--bg)}

/* game */
.game{flex:1;display:flex;flex-direction:column;min-height:0}
.board{flex:1;overflow-y:auto;padding:10px 12px;min-height:0}
.sb.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sb.one{display:grid;grid-template-columns:1fr}
.pl{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.pl.on{border-color:var(--brass);box-shadow:inset 0 5px 0 var(--brass)}
.pl-top{display:flex;justify-content:space-between;gap:6px;align-items:baseline;min-width:0}
.nm{font:700 21px/1.1 var(--fc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lg{font:600 16px var(--fc);color:var(--muted);white-space:nowrap}
.rem{font:800 clamp(58px,18vw,96px)/1 var(--fc);font-variant-numeric:tabular-nums;margin:6px 0 4px;letter-spacing:-1px}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px;color:var(--muted)}
.sb.list .pl{display:grid;grid-template-columns:1fr auto;column-gap:10px;margin-bottom:8px}
.sb.list .pl-top{grid-column:1}
.sb.list .meta{grid-column:1}
.sb.list .rem{grid-column:2;grid-row:1/3;font-size:50px;margin:0;align-self:center}
.sb.list .slots,.sb.list .co,.sb.list .hint{grid-column:1/3}
.slots{display:flex;gap:6px;margin-top:8px}
.slot{flex:1;height:34px;border-radius:8px;border:1px dashed var(--line);display:grid;place-items:center;font:700 19px var(--fc)}
.slot.f{border-style:solid;background:var(--surf2)}
.co{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.co span{padding:2px 10px;border-radius:7px;background:var(--brass);color:var(--on-accent);font:700 19px/1.3 var(--fc)}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.bust{color:var(--red)}
.banner{display:flex;justify-content:space-between;align-items:baseline;margin:2px 2px 10px}
.banner b{font:800 40px/1 var(--fc)}
.banner span{color:var(--muted);font-size:14px}
.bar{height:8px;border-radius:4px;background:var(--surf2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--green)}

.cr{width:100%;border-collapse:separate;border-spacing:0 4px;table-layout:fixed}
.cr th,.cr td{text-align:center;padding:5px 2px}
.cr thead th{font:700 18px/1.1 var(--fc);vertical-align:bottom;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr thead th small{display:block;font:800 30px/1.1 var(--fc)}
.cr thead th.on{box-shadow:inset 0 -4px 0 var(--brass)}
.cr tbody th{font:800 24px var(--fc);width:52px}
.cr tbody td{background:var(--surf);font:700 24px var(--fc);height:40px}
.cr tbody td.on{background:var(--surf2)}
.cr tr.dead th{color:var(--muted);text-decoration:line-through}
.mk3{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:3px solid var(--green);color:var(--green);font-size:18px;line-height:1}
.mk{color:var(--text)}

.pad{padding:8px 10px;border-top:1px solid var(--line);background:var(--surf2);display:grid;gap:6px}
.mulrow{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mul{height:44px;border-radius:10px;font:700 20px var(--fc);border:2px solid var(--line);background:var(--surf)}
.mul.d.on{background:var(--red);border-color:var(--red);color:#fff}
.mul.t.on{background:var(--green);border-color:var(--green);color:#fff}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.k{height:50px;border-radius:10px;background:var(--surf);border:1px solid var(--line);font:700 23px var(--fc);transition:transform .06s}
.k:active:not(:disabled){transform:scale(.95)}
.k.hl{border:2px solid var(--brass)}
.k:disabled{opacity:.35}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.k.bull{color:var(--red)}
.k.miss{color:var(--muted)}
.k.small{font-size:18px}
.k.ok{background:var(--green);color:var(--on-accent);border-color:transparent}
.typed{font:800 46px/1 var(--fc);text-align:center;padding:2px 0;font-variant-numeric:tabular-nums}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.quick .k{height:40px;font-size:20px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.link{font:600 15px var(--fb);color:var(--muted);text-decoration:underline;padding:4px;justify-self:center}
.fx-bust{animation:fxb .7s ease-out}.fx-win,.fx-180{animation:fxw .7s ease-out}
@keyframes fxb{from{box-shadow:inset 0 0 0 5px var(--red)}to{box-shadow:inset 0 0 0 0 transparent}}
@keyframes fxw{from{box-shadow:inset 0 0 0 5px var(--green)}to{box-shadow:inset 0 0 0 0 transparent}}
.preview{text-align:center;font:600 17px var(--fc);color:var(--muted);min-height:22px}
.ws{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ws th{font:700 17px var(--fc);text-align:right;padding:6px;border-bottom:1px solid var(--line)}
.ws td{text-align:right;padding:5px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.ws td b{font:700 19px var(--fc)}.ws td span{color:var(--muted);font-size:13px;margin-left:6px}
.ws td.n{color:var(--muted);text-align:left;font-size:13px}
.legrow{padding:10px 2px;border-bottom:1px solid var(--line)}
.legrow summary{list-style:none;cursor:pointer}.legrow summary::-webkit-details-marker{display:none}.legrow[open] summary>div:last-child{display:none}
.legrow b{font:700 19px var(--fc)}.legrow div{font-size:14px;color:var(--muted)}
.spark{width:100%;height:56px;display:block;margin-top:6px}
.dbls{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.dbls span{border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:13.5px}
.dbls b{font:700 16px var(--fc)}
.cpuwait{min-height:200px;display:grid;place-items:center;font:700 26px var(--fc);color:var(--muted)}
.bob{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bob .k{height:76px;font-size:34px}
@media (max-height:720px){.k{height:44px}.mul{height:38px}.bob .k{height:60px}.rem{font-size:clamp(50px,15vw,80px)}}

/* pad states */
.pad.m2 .nums .k{border:2px solid var(--red);color:var(--red);background:color-mix(in srgb,var(--red) 9%,var(--surf))}
.pad.m3 .nums .k{border:2px solid var(--green);color:var(--green);background:color-mix(in srgb,var(--green) 10%,var(--surf))}
.k{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.k.miss{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.k.miss small{font:500 10.5px/1.15 var(--fb);color:var(--muted);margin-top:3px;max-width:96%;overflow:hidden}
/* the hint only shows when the key is big enough; otherwise a one-time tip explains the long press */
.k.miss{container-type:size;overflow:hidden}
@container (max-width:88px) or (max-height:54px){.k.miss small{display:none}}
.k.wide{width:100%;height:42px}

.shake{animation:shake .45s;box-shadow:inset 0 0 0 2px var(--red)!important}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.glow{animation:glow 1.3s ease-out}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(217,180,76,.95)}35%{box-shadow:0 0 0 9px rgba(217,180,76,.45)}100%{box-shadow:0 0 0 0 rgba(217,180,76,0)}}
.celeb{position:fixed;inset:0;display:grid;place-items:center;z-index:54;pointer-events:none}
.celeb>div{display:grid;justify-items:center;gap:12px;animation:celebIn 1.6s ease-out forwards}
.celeb svg{width:min(44vw,190px);height:auto}
.celeb b{font:800 min(12vw,58px)/1 var(--fc);color:var(--brass);text-shadow:0 3px 0 var(--wire)}
@keyframes celebIn{0%{transform:scale(.3) rotate(-30deg);opacity:0}25%{transform:scale(1.06) rotate(4deg);opacity:1}40%{transform:scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:scale(1.04)}}
.nmc{display:flex;flex-direction:column;min-width:0}
.tm{font:500 13px var(--fb);color:var(--muted)}
.pl.out{opacity:.45}
.ktag{color:var(--red);font-weight:700}
.drt{font-size:clamp(56px,18vw,96px)!important}
.ws td.ed{cursor:pointer}.ws td.ed b{text-decoration:underline dotted;text-underline-offset:3px}
.chart{width:100%;height:auto;display:block;margin-top:4px}
.chart .ax,.heat .ax{font:600 10px var(--fb);fill:var(--muted)}
.heat .ax{font-size:15px}
.leg2{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;margin:4px 0 6px}
.leg2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.heat{width:100%;max-width:330px;display:block;margin:6px auto}
.ach{display:flex;flex-wrap:wrap;gap:6px}
.ach span{border:1px dashed var(--line);border-radius:999px;padding:4px 10px;font-size:13px;color:var(--muted)}
.ach span.on{border-style:solid;border-color:var(--brass);color:var(--text)}
.h2hsel{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:10px}
.h2hsel .field{padding:10px;font-size:15px}
.h2hsc{font:800 48px/1 var(--fc);text-align:center;margin:6px 0}
.hsel{flex:none;width:auto;padding:8px 10px}
.drill{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 14px;border-radius:16px;margin-bottom:10px;border:1px solid var(--line);background:var(--surf)}
.drill b{display:block;font:700 21px/1.15 var(--fc)}
.drill small{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.dic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;flex:none;font:800 19px var(--fc);background:var(--surf2)}
.c-catCo{background:color-mix(in srgb,#4B8FD6 13%,var(--surf))}.c-catCo .dic{color:#3A7BC0}
.c-catDbl{background:color-mix(in srgb,var(--red) 11%,var(--surf))}.c-catDbl .dic{color:var(--red)}
.c-catScore{background:color-mix(in srgb,var(--brass) 14%,var(--surf))}.c-catScore .dic{color:var(--brass)}
.c-catPrec{background:color-mix(in srgb,var(--green) 12%,var(--surf))}.c-catPrec .dic{color:var(--green)}
select.field{appearance:auto}
/* ---- game board: every player always on screen, every row sizes its own content ---- */
.board{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:8px 10px}
.board>.banner{flex:none;margin:0 2px 6px}.board>.banner b{font-size:clamp(24px,7vw,40px)}
.sb.rows{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.sb.rows .pl{flex:1 1 0;min-height:0;min-width:0;container-type:size;overflow:hidden;margin:0;padding:6px 12px;
  display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;align-content:center;align-items:center}
.sb.rows .pl.on{flex-grow:var(--g,1)}
.sb.rows .pl>.pl-top{grid-column:1;grid-row:1;min-width:0}
.sb.rows .pl>.meta{grid-column:1;grid-row:2;min-width:0}
.sb.rows .pl>.rem{grid-column:2;grid-row:1/3;margin:0;line-height:.9;font-size:clamp(15px,min(60cqh,24cqw),58px)}
.sb.rows .pl>.bar{grid-column:1/-1;grid-row:3;margin-top:4px}
.sb.rows .pl>.slots,.sb.rows .pl>.co,.sb.rows .pl>.hint{grid-column:1/-1;grid-row:4;margin-top:4px}
.sb.rows .pl>.slots .slot{height:min(34px,22cqh);font-size:min(19px,13cqh)}
.nmw{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.nmc{display:flex;flex-direction:column;min-width:0}
.sb .nm{font-size:clamp(14px,30cqh,21px)}
.sb .nm.long{font-size:clamp(12px,min(30cqh,6.4cqw),21px)}
.starter{width:10px;height:10px;border-radius:50%;background:var(--brass);flex:none}
.lgs{display:flex;gap:10px;align-items:center;flex:none}
.lgi{display:flex;align-items:center;gap:4px}
.lgi small{font:600 12px var(--fb);color:var(--muted)}
.lgn{font:700 15px var(--fc)}
.dots{display:flex;gap:3px}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted)}
.dots i.w{background:var(--green);border-color:var(--green)}
.ktag{color:var(--red);font:700 15px var(--fc);flex:none}
/* active X01 / practice row: score left, darts and checkout right */
.sb.rows .pl.xm{display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;gap:2px;padding:8px 12px}
.xm .mid{flex:1;min-height:0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.xm .mid .rem{font-size:min(130px,62cqh,30cqw);margin:0;line-height:.85}
.vis{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:5px;flex:none;min-width:0}
.vis .slots{display:flex;gap:5px;margin:0}
.vis .slot{flex:none;width:min(54px,13cqw);height:min(34px,15cqh);font-size:min(19px,10cqh)}
.vsum{font:800 min(32px,14cqh)/1 var(--fc);font-variant-numeric:tabular-nums}

const COC={};
function checkout(rem,darts,out){
  if(!(rem>0)||rem>180||darts<1)return null;const k=rem+'_'+darts+'_'+out;if(k in COC)return COC[k];
  if(out==='double'&&STDT[rem]&&STDT[rem].length<=darts)return COC[k]=STDT[rem];
  const F=FIN[out];let best=null,bc=Infinity;
  if(F[rem]){best=[F[rem].t];bc=F[rem].c}
  if(!best&&darts>=2)for(const a of ALL){const f=F[rem-a.v];if(f){const c=setCost(a)+f.c;if(c<bc){bc=c;best=[a,f.t]}}}
  if(!best&&darts>=3)for(const a of ALL)for(const b of ALL){const f=F[rem-a.v-b.v];if(f){const c=setCost(a)+setCost(b)+f.c;if(c<bc){bc=c;best=[a,b,f.t]}}}
  return COC[k]=best;
}

function nextTurn(){

/* X01 */
function x01Dart(n,m){

  if(G.opened[p]&&o.outMode!=='single'&&FIN[o.outMode][rem]){st.coAtt++;const k=lab(FIN[o.outMode][rem].t);st.dbl=st.dbl||{};(st.dbl[k]=st.dbl[k]||[0,0])[0]++}

  G.visit.push({n,m,v:counted});

  if(nr<0||(nr===0&&!okFin)||(nr===1&&o.outMode!=='single'))return x01EndVisit(true);

  if(nr===0){const k=lab({n,m});if(st.dbl&&st.dbl[k])st.dbl[k][1]++;return x01Checkout()}

function x01Record(p,score,nd,bust){

}
function x01EndVisit(bust){

  const score=G.visitStart-G.rem[p];

  G.last[p]={score,bust,d:G.visit.filter(d=>!d.tot).map(lab)};
  if(score===180&&!bust){big180();FX={k:'180',p}}else if(bust)FX={k:'bust',p};
  if(!bust)recVisit(p,score);
  nextTurn();
  const q=G.turn,r=G.rem[q];
  let txt=bust?t('vBust'):score===180?t('v180'):score===0?t('vNone'):String(score);
  if(G.opened[q]&&checkout(r,3,G.opts.outMode))txt+='. '+t('vReq',pname(q),r);
  say(txt);
}
function x01Checkout(){
  const p=G.turn,st=G.stats[p],nd=G.visit.length,score=G.visitStart;

}
function x01Total(tv,used,dbl){

  G.stats[p].coAtt+=dbl;
  G.visit=Array.from({length:used},()=>({n:0,m:0,v:0,tot:true}));
  const nr=rem-tv;
  const bust=nr<0||(nr===1&&o.outMode!=='single')||(nr===0&&!checkout(rem,3,o.outMode));
  if(bust)x01EndVisit(true);

/* Cricket */
function crClosed(p){return CT.every(t=>G.marks[p][t]>=3)}
function crWin(p){
  if(!crClosed(p))return false;const v=G.opts.variant;if(v==='noscore')return true;
  const others=G.points.filter((_,i)=>i!==p);if(!others.length)return true;
  return v==='cut'?G.points[p]<=Math.min(...others):G.points[p]>=Math.max(...others);
}
function crDart(n,m){
  const p=G.turn,st=G.stats[p],v=G.opts.variant;G.visit.push({n,m});
  if(CT.includes(n)&&m>0){
    for(let i=0;i<m;i++){
      if(G.marks[p][n]<3){G.marks[p][n]++;st.marks++}
      else if(v!=='noscore'){
        const opn=G.players.map((_,q)=>q).filter(q=>q!==p&&G.marks[q][n]<3);
        if(opn.length){st.marks++;if(v==='cut')opn.forEach(q=>G.points[q]+=n);else G.points[p]+=n}

}
/* Around the clock */

}
/* Shanghai */
function shDart(n,m){

    st.rounds++;G.last[p]={d:G.visit.map(lab)};
    const ms=new Set(G.visit.filter(d=>d.n===G.round&&d.m>0).map(d=>d.m));

function undo(){

/* ---------- CPU opponent ----------
   Each dart is simulated on the real board geometry (mm): it aims at the centre of the chosen bed
   with Gaussian scatter. The level sets the scatter, so averages and checkout % come out realistic. */
const CPU_SIGMA=[80,62,44,31,23,18,15.5,13,10.8,8.2];
/* Each level is named after a darts champion; if a real player already uses that name, the next free one is taken */
const CPU_NAMES=['Eric Bristow','John Part','Lisa Ashton','Raymond van Barneveld','Fallon Sherrock','Gary Anderson','Beau Greaves','Michael van Gerwen','Luke Littler','Phil Taylor'];
function cpuName(){
  const c=SETUP.cpu,own=(c.name||'').trim();if(own)return own;
  const taken=new Set(DB.players.map(p=>p.name.toLowerCase()));
  const pref=CPU_NAMES[c.level-1];if(!taken.has(pref.toLowerCase()))return pref;
  return CPU_NAMES.find(n=>!taken.has(n.toLowerCase()))||pref+' (CPU)';
}
const CPU_AVG=[21,26,32,39,45,54,60,68,79,95];// averages measured in simulation (501, double out)
let CPU_T=null;
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function aimPoint(t){if(t.n===25)return t.m===2?[0,0]:[0,11];const a=BOARD.indexOf(t.n)*18*Math.PI/180,r=t.m===3?103:t.m===2?166:134;return[r*Math.sin(a),r*Math.cos(a)]}
function hitAt(x,y){const r=Math.hypot(x,y);if(r>170)return{n:0,m:0};if(r<=6.35)return{n:25,m:2};if(r<=15.9)return{n:25,m:1};
  const deg=(Math.atan2(x,y)*180/Math.PI+369)%360,n=BOARD[Math.floor(deg/18)%20];return{n,m:r>=99&&r<=107?3:r>=162?2:1}}
/* doubles use their own scatter, otherwise low levels would almost never check out */
const CPU_DSIG=[34,26,21,18,15.5,13,11.5,10,8.5,7.3];
function throwAt(t,level){const L=Math.max(1,Math.min(10,level))-1,s=t.m===2?CPU_DSIG[L]:CPU_SIGMA[L],[x,y]=aimPoint(t);return hitAt(x+gauss()*s,y+gauss()*s)}
function cpuTarget(){
  const p=G.turn,o=G.opts;
  if(G.mode==='killer'){if(!G.killer[p])return{n:G.kn[p],m:2};const q=G.players.map((_,i)=>i).filter(i=>i!==p&&!G.out[i]).sort((a,b)=>G.lives[a]-G.lives[b])[0];return{n:G.kn[q],m:2}}
  if(G.mode==='x01'){
    if(!G.opened[p])return{n:20,m:2};
    const rem=G.rem[p],left=3-G.visit.length,r=checkout(rem,left,o.outMode);
    if(r)return r[0];
    if(o.outMode==='single')return{n:20,m:3};
    let best={n:20,m:3},bc=-Infinity;
    for(const t of ALL){const nr=rem-t.v;if(nr<2)continue;const lv=checkout(nr,3,o.outMode);
      const sc=(lv?100:0)+(lv&&lv.length===1?30-(DPREF[nr]??4)*5:0)+(lv&&lv.length===2?10:0)+t.v*(rem>110?1:.2)-setCost(t)*8;
      if(sc>bc){bc=sc;best=t}}
    return best;
  }
  if(G.mode==='cricket'){
    const v=o.variant,me=G.marks[p],oth=G.players.map((_,i)=>i).filter(i=>i!==p),aim=t=>t===25?{n:25,m:2}:{n:t,m:3};
    const open=CT.filter(t=>me[t]<3),scoreOn=CT.filter(t=>me[t]>=3&&oth.some(q=>G.marks[q][t]<3));
    if(v!=='noscore'&&scoreOn.length&&oth.length){

      const behind=v==='cut'?G.points[p]>Math.min(...op):G.points[p]<Math.max(...op);
      if(behind||!open.length)return aim(scoreOn[0]);
    }
    const danger=open.filter(t=>oth.some(q=>G.marks[q][t]>=3));
    return aim((danger.length?danger:open)[0]||20);
  }
  if(G.mode==='atc'){const t=atcSeq()[G.pos[p]],v=o.variant;if(t===25)return{n:25,m:v==='any'?1:2};return{n:t,m:v==='double'?2:v==='triple'?3:1}}
  return{n:G.round,m:3};
}
function cpuActive(){return V.name==='game'&&G&&!G.finished&&!G.notice&&!G.bulloff&&G.players[G.turn].cpu}
function scheduleCpu(){if(CPU_T||!cpuActive())return;CPU_T=setTimeout(()=>{CPU_T=null;if(cpuActive())cpuStep()},G.visit.length?650:950)}

  const r=throwAt(cpuTarget(),pl.level);dart(r.n,r.m);
}

/* ---------- helpers: names, sounds, effects ---------- */

let AC=null,CLAP=null;
function actx(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C()}if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function noiseBuf(a,sec,decay){const b=a.createBuffer(1,Math.max(1,Math.floor(a.sampleRate*sec)),a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,decay);return b}
/* synthesised, so no third-party audio files or licences are needed */
function sfxThud(){
  if(!DB.settings.sfx)return;const a=actx();if(!a)return;const t0=a.currentTime;
  const s=a.createBufferSource();s.buffer=noiseBuf(a,.09,7);const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=2400;const g=a.createGain();g.gain.value=.5;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t0);
  const o=a.createOscillator(),og=a.createGain();o.type='sine';o.frequency.setValueAtTime(190,t0);o.frequency.exponentialRampToValueAtTime(70,t0+.09);
  og.gain.setValueAtTime(.4,t0);og.gain.exponentialRampToValueAtTime(.001,t0+.11);o.connect(og);og.connect(a.destination);o.start(t0);o.stop(t0+.12);
}
function sfxApplause(dur){
  if(!DB.settings.sfx)return;const a=actx();if(!a)return;const t0=a.currentTime+.05;
  if(!CLAP)CLAP=noiseBuf(a,.03,4);
  const out=a.createGain();out.gain.setValueAtTime(0,t0);out.gain.linearRampToValueAtTime(.55,t0+.25);out.gain.setValueAtTime(.55,t0+dur*.55);out.gain.linearRampToValueAtTime(0,t0+dur);out.connect(a.destination);
  for(let i=0,n=Math.round(dur*45);i<n;i++){const s=a.createBufferSource();s.buffer=CLAP;s.playbackRate.value=.8+Math.random()*.5;
    const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=900+Math.random()*1600;f.Q.value=.9;const g=a.createGain();g.gain.value=.12+Math.random()*.22;
    s.connect(f);f.connect(g);g.connect(out);s.start(t0+Math.random()*dur*.95)}
  const bed=a.createBufferSource();bed.buffer=noiseBuf(a,dur,.6);const bf=a.createBiquadFilter();bf.type='bandpass';bf.frequency.value=1200;bf.Q.value=.5;
  const bg=a.createGain();bg.gain.value=.08;bed.connect(bf);bf.connect(bg);bg.connect(out);bed.start(t0);
}
function vibTriple(){if(!DB.settings.vibrate)return;const H=CAP('Haptics');
  if(H){[0,140,280].forEach(d=>setTimeout(()=>H.impact({style:'HEAVY'}).catch(()=>{}),d));return}
  if(navigator.vibrate)try{navigator.vibrate([40,70,40,70,40])}catch(e){}}

/* rolling numbers: [data-anim] elements count from their previous value to the new one */
const ANIM={};
function animNums(){
  if(!G||V.name!=='game')return;const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('[data-anim]').forEach(el=>{

/* ---------- personal bests and achievements ---------- */
function playerBests(pid,skipId){
  const b={hiCo:0,leg:0,hiV:0,avg:0,has180:false,games:0};
  for(const h of DB.history){
    if(h.id===skipId||h.mode==='drill')continue;const i=h.players.findIndex(p=>p.id===pid);if(i<0)continue;b.games++;
    if(h.mode!=='x01')continue;const s=h.stats[i];b.hiCo=Math.max(b.hiCo,s.hiCo||0);
    s.visits.forEach(v=>{if(v>b.hiV)b.hiV=v;if(v===180)b.has180=true});
    if((h.starts?h.starts[i]:h.opts.start)===501)s.legDarts.forEach(x=>{if(!b.leg||x<b.leg)b.leg=x});
    if(s.darts>=9)b.avg=Math.max(b.avg,s.pts/s.darts*3);
  }

}
function recVisit(p,score){

/* ---------- edit a past visit (X01, current leg) ---------- */
function editVisit(idx){
  const e=G.legLog[idx];if(!e||G.finished)return;const p=e.p;
  if(G.opts.inMode!=='single'){toast(t('editIn'));return}
  if(G.turn===p&&G.visit.length){toast(t('finishVisit'));return}
  promptNum(t('editVisit'),e.b?0:e.s,val=>{
    const S=parseInt(val,10);
    if(!(S>=0&&S<=180)||IMPOSSIBLE.includes(S)){toast(t('cantScore',isNaN(S)?'?':S));return}
    const own=G.legLog.map((x,j)=>({x,j})).filter(o=>o.x.p===p),pos=own.findIndex(o=>o.j===idx);
    const before=pos===0?G.starts[p]:own[pos-1].x.r,min=G.opts.outMode==='single'?1:2;
    let r=before-S;if(r<min){toast(t('editBad'));return}
    for(let k=pos+1;k<own.length;k++){const x=own[k].x;if(x.b){toast(t('editBad'));return}r-=x.s;if(r<min){toast(t('editBad'));return}}
    pushUndo();
    const delta=S-(e.b?0:e.s),st=G.stats[p];
    st.pts+=delta;if(e.vi!=null&&st.visits[e.vi]!=null)st.visits[e.vi]=S;if(pos<3)st.f9p+=delta;
    e.s=S;e.b=0;r=before;for(let k=pos;k<own.length;k++){r-=own[k].x.s;own[k].x.r=r}
    G.rem[p]=r;if(G.turn===p)G.visitStart=r;
    if(pos===own.length-1)G.last[p]={score:S,bust:false,d:[]};
    saveGame();render();toast(t('edited'));
  });
}

/* ---------- Killer ---------- */
function killerInit(){
  if(!G.kn){const nums=shuffle([...Array(20)].map((_,i)=>i+1));G.kn=G.players.map((_,i)=>nums[i])}
  G.lives=G.players.map(()=>G.opts.lives||3);G.killer=G.players.map(()=>false);G.out=G.players.map(()=>false);
}
function kLife(i){G.lives[i]--;if(G.lives[i]<=0){G.out[i]=true;toast(t('isOut',pname(i)))}}
function kDart(n,m){
  const p=G.turn,st=G.stats[p];G.visit.push({n,m});st.darts++;
  if(m===2&&n!==25){const q=G.kn.indexOf(n);
    if(q===p){if(!G.killer[p]){G.killer[p]=true;st.hits++;toast(t('vKiller',pname(p)));say(t('vKiller',pname(p)))}else kLife(p)}
    else if(q>=0&&G.killer[p]&&!G.out[q]){st.hits++;kLife(q)}}
  const alive=G.players.map((_,i)=>i).filter(i=>!G.out[i]);
  if(alive.length<=1){st.rounds++;return legWon(alive.length?alive[0]:p)}

}

/* ---------- practice drills (solo) ---------- */
const HI_SEQ=[15,16,'D',17,18,'T',19,20,'B'];
const DRILLS=[['catCo',['co','121','c40']],['catDbl',['dbl','bobs']],['catScore',['cu','tgt']],['catPrec',['atc','hi']]];
const DICON={co:'170','121':'121',c40:'40',dbl:'D',bobs:'27',cu:'Σ',tgt:'T20',atc:'1›20',hi:'½'};
function randCo(){let r;do{r=2+Math.floor(Math.random()*169)}while(!checkout(r,3,'double'));return r}
function drInit(){
  const d=G.opts.drill,s={round:0,score:0,hits:0,vn:0,dartsIn:0};
  if(d==='co'){s.total=10;s.target=randCo()}
  if(d==='121'){s.total=10;s.target=121;s.best=0}
  if(d==='c40'){s.total=40;s.target=61}
  if(d==='dbl')s.total=21;
  if(d==='cu')s.total=8;
  if(d==='tgt'){s.total=10;s.tg=parseDart(G.opts.tgt||'T20')}

}
function coEnd(ok){
  const s=G.dr,d=G.opts.drill,used=s.dartsIn;
  if(ok){s.hits++;if(d==='co')s.score++;if(d==='c40')s.score+=used<=2?3:used===3?2:1;if(d==='121'){s.best=Math.max(s.best,s.target);s.score=s.best;s.target++}}
  toast(t(ok?'trOk':'trKo'));if(ok)sfxApplause(1.2);
  s.round++;G.visit=[];
  if(s.round>=s.total)return drFinish();

  s.rem=s.vs=s.target;s.vn=0;s.dartsIn=0;
}
function coNextVisit(maxV){const s=G.dr;s.vn++;s.dartsIn=s.vn*3;G.last[0]={d:G.visit.map(lab)};G.visit=[];s.vs=s.rem;if(s.vn>=maxV)coEnd(false)}
function drDart(n,m){
  const s=G.dr,d=G.opts.drill,st=G.stats[0],v=n*m;G.visit.push({n,m,v});st.darts++;
  if(d==='co'||d==='121'||d==='c40'){
    const maxV=d==='co'?1:d==='c40'?2:3,nr=s.rem-v;s.dartsIn++;
    if(nr===0&&m===2)return coEnd(true);
    if(nr<0||nr<=1){s.rem=s.vs;return coNextVisit(maxV)}
    s.rem=nr;if(G.visit.length===3)coNextVisit(maxV);return;
  }
  if(d==='dbl'){const tg=s.round<20?s.round+1:25;if(n===tg&&m===2){s.hits++;s.score++}}
  if(d==='cu')s.score+=v;
  if(d==='tgt'&&n===s.tg.n&&m===s.tg.m){s.hits++;s.score++}
  if(d==='hi'){const x=HI_SEQ[s.round],ok=x==='D'?m===2:x==='T'?m===3:x==='B'?n===25:n===x&&m>0;if(ok&&v){s.rp+=v;s.hits++}}

    G.last[0]={d:G.visit.map(lab)};G.visit=[];s.round++;

  }
}

const PCOL=['#2FA866','#D9483E','#C9A23A','#4B8FD6','#9B6BD3','#D9822B','#2BB3B3','#C2589B'];

function lineChart(series,names){

function barChart(groups,labels,names){
  const W=320,H=150,B=20,mx=Math.max(1,...groups.flat()),gw=(W-8)/labels.length,bw=Math.min(14,(gw-6)/groups.length);let g='';

    g+=`<text x="${(4+j*gw+gw/2).toFixed(1)}" y="${H-5}" text-anchor="middle" class="ax">${l}</text>`});

function matchCharts(r){

/* hit map: every bed of the board coloured by how often it was hit */
function heatSVG(hm){
  const c=0,P=(r,a)=>{const q=(a-90)*Math.PI/180;return(r*Math.cos(q)).toFixed(1)+' '+(r*Math.sin(q)).toFixed(1)};
  const seg=(r1,r2,a1,a2,fill,op)=>`<path d="M${P(r2,a1)}A${r2} ${r2} 0 0 1 ${P(r2,a2)}L${P(r1,a2)}A${r1} ${r1} 0 0 0 ${P(r1,a1)}Z" fill="${fill}" fill-opacity="${op}" stroke="var(--line)" stroke-width=".6"/>`;
  const vals=Object.entries(hm).filter(([k])=>k!=='0-0').map(([,v])=>v),mx=Math.max(1,...vals);
  const op=k=>{const v=hm[k]||0;return v?(.12+.85*Math.sqrt(v/mx)).toFixed(2):0};
  let g=`<circle r="170" fill="var(--surf2)" stroke="var(--line)"/>`;
  BOARD.forEach((n,i)=>{const a1=i*18-9,a2=a1+18;
    g+=seg(162,170,a1,a2,'var(--red)',op(n+'-2'))+seg(107,162,a1,a2,'var(--red)',op(n+'-1'))+seg(99,107,a1,a2,'var(--red)',op(n+'-3'))+seg(16,99,a1,a2,'var(--red)',op(n+'-1'));
    const q=(i*18-90)*Math.PI/180;g+=`<text x="${(186*Math.cos(q)).toFixed(1)}" y="${(186*Math.sin(q)+5).toFixed(1)}" text-anchor="middle" class="ax">${n}</text>`});
  g+=`<circle r="16" fill="var(--red)" fill-opacity="${op('25-1')}" stroke="var(--line)"/><circle r="6.4" fill="var(--red)" fill-opacity="${op('25-2')}" stroke="var(--line)"/>`;
  const tot=Object.values(hm).reduce((a,b)=>a+b,0);
  return`<svg class="heat" viewBox="-200 -200 400 400" role="img" aria-label="${t('heat')}">${g}</svg><div class="meta" style="justify-content:space-between"><span>${t('darts',tot)}</span><span>${t('misses',hm['0-0']||0)}</span></div>`;
}

/* ---------- update check (APK only) ---------- */
const APP_BUILD='dev';
const REPO='pilippopilippo/darts';let UPD=null;
function cmpVer(a,b){const x=a.split('.').map(Number),y=b.split('.').map(Number);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d>0?1:-1}return 0}
/* checked at every start and every return to the app (at most every 15 minutes), or on demand from Settings */
let APPVER='';
async function checkUpdate(force){
  const A=CAP('App'),fail=()=>{if(force)toast(t('updFail'))};if(!A)return fail();
  try{
    if(!APPVER){APPVER=(await A.getInfo()).version||'';if(V.name==='settings')render()}
    if(!/^\d+(\.\d+)*$/.test(APPVER))return fail();
    if(!force&&Date.now()-LS.get('updchk',0)<15*60e3)return;
    LS.set('updchk',Date.now());
    const r=await fetch(`https://api.github.com/repos/${REPO}/releases/latest`,{headers:{Accept:'application/vnd.github+json'},cache:'no-store'});
    if(!r.ok)return fail();
    const v=String((await r.json()).tag_name||'').replace(/^v/,'');
    if(/^\d+(\.\d+)*$/.test(v)&&cmpVer(v,APPVER)>0&&(force||LS.get('updskip','')!==v)){UPD={v};if(V.name==='home'||V.name==='settings')render()}
    else{UPD=null;if(force){toast(t('updNone'));render()}}
  }catch(e){fail()}
}

function boardSVG(){
  const c=60,P=(r,a)=>{const t=(a-90)*Math.PI/180;return(c+r*Math.cos(t)).toFixed(2)+' '+(c+r*Math.sin(t)).toFixed(2)};
  const seg=(r1,r2,a1,a2,f)=>`<path d="M${P(r2,a1)}A${r2} ${r2} 0 0 1 ${P(r2,a2)}L${P(r1,a2)}A${r1} ${r1} 0 0 0 ${P(r1,a1)}Z" fill="${f}"/>`;
  let s=`<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="59" fill="var(--wire)"/>`;
  BOARD.forEach((_,i)=>{const a1=i*18-9,a2=a1+18,ring=i%2?'var(--green)':'var(--red)',fld=i%2?'var(--sisal)':'var(--wire)';
    s+=seg(44,50,a1,a2,ring)+seg(32,44,a1,a2,fld)+seg(27,32,a1,a2,ring)+seg(7,27,a1,a2,fld)});
  return s+`<circle cx="60" cy="60" r="7" fill="var(--green)"/><circle cx="60" cy="60" r="3.2" fill="var(--red)"/></svg>`;
}

function aggregate(pid,since){
  const a={g:0,w:0,pts:0,d:0,f9p:0,f9d:0,coH:0,coA:0,hiCo:0,best:0,v180:0,v140:0,v100:0,hiV:0,crM:0,crR:0,bob:null,atc:0,x01:0,cr:0,tx:[],tc:[],dbl:{},hm:{},dr:{}};
  for(const h of DB.history){if(h.ended<since)continue;const i=h.players.findIndex(p=>p.id===pid);if(i<0)continue;
    for(const k in h.stats[i].hm||{})a.hm[k]=(a.hm[k]||0)+h.stats[i].hm[k];
    if(h.mode==='drill'){const d=h.opts.drill;a.dr[d]=Math.max(a.dr[d]||0,h.stats[i].score||0);continue}
    a.g++;if(h.winner===i&&h.players.length>1)a.w++;const s=h.stats[i];
    if(h.mode==='x01'){a.x01++;a.pts+=s.pts;a.d+=s.darts;a.f9p+=s.f9p;a.f9d+=s.f9d;a.coH+=s.coHit;a.coA+=s.coAtt;a.hiCo=Math.max(a.hiCo,s.hiCo);
      if((h.starts?h.starts[i]:h.opts.start)===501)s.legDarts.forEach(x=>{if(!a.best||x<a.best)a.best=x});a.v180+=cnt(s.visits,180,181);a.v140+=cnt(s.visits,140,180);a.v100+=cnt(s.visits,100,140);
      s.visits.forEach(x=>{if(x>a.hiV)a.hiV=x});if(s.darts)a.tx.push(s.pts/s.darts*3);
      for(const k in s.dbl||{}){const d=a.dbl[k]=a.dbl[k]||[0,0];d[0]+=s.dbl[k][0];d[1]+=s.dbl[k][1]}}
    if(h.mode==='cricket'){a.cr++;a.crM+=s.marks;a.crR+=s.rounds;if(s.rounds)a.tc.push(s.marks/s.rounds)}
    if(h.mode==='bobs')a.bob=a.bob==null?s.score:Math.max(a.bob,s.score);
    if(h.mode==='atc'&&h.winner===i&&(!a.atc||s.darts<a.atc))a.atc=s.darts;
  }
  return a;
}

    players:h.players.map(p=>({id:str(p&&p.id),name:str(p&&p.name),cpu:!!(p&&p.cpu),level:num(p&&p.level)})),
    winner:h.winner==null||!(num(h.winner)<h.players.length)?null:num(h.winner),legsWon:arr(h.legsWon).map(num),setsWon:arr(h.setsWon).map(num),
    stats:h.stats.map(s=>{s=s||{};const r={};['pts','darts','f9p','f9d','coHit','coAtt','hiCo','marks','rounds','hits','score'].forEach(k=>r[k]=num(s[k]));r.visits=arr(s.visits).map(num);r.legDarts=arr(s.legDarts).map(num);r.hm={};if(s.hm&&typeof s.hm==='object')for(const k in s.hm)if(/^\d{1,2}-[0-3]$/.test(k))r.hm[k]=num(s.hm[k]);r.dbl={};if(s.dbl&&typeof s.dbl==='object')for(const k in s.dbl)if(/^(D\d{1,2}|T\d{1,2}|Bull|\d{1,2}|25)$/.test(k)&&Array.isArray(s.dbl[k]))r.dbl[k]=[num(s.dbl[k][0]),num(s.dbl[k][1])];return r}),
    legs:arr(h.legs).map(e=>{e=e||{};return{set:num(e.set),leg:num(e.leg),w:num(e.w),d:num(e.d),co:num(e.co),r:num(e.r),avg:e.avg?arr(e.avg).map(num):undefined,mpr:e.mpr?arr(e.mpr).map(num):undefined,log:arr(e.log).map(v=>({p:num(v&&v.p),s:num(v&&v.s),n:num(v&&v.n),r:num(v&&v.r),b:v&&v.b?1:0}))}})}});
  return{players,history};
}
function applyTheme(){const t=DB.settings.theme;if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t)}

function render(){
  const app=document.getElementById('app');
  const map={home:vHome,setup:vSetup,training:vTraining,game:vGame,results:vResults,history:vHistory,match:vMatch,players:vPlayers,stats:vStats,settings:vSettings,mstats:vMstats};
  app.innerHTML=(map[V.name]||vHome)();
  runFx();animNums();
  keepAwake(V.name==='game'&&DB.settings.awake);
  if(V.name==='game'&&G&&G.notice){const n=G.notice,nm=esc(G.players[n.p].name);
    const sc=G.opts.sets>1?`Set ${G.setsWon.join(' – ')}, leg ${G.legsWon.join(' – ')}`:`Leg ${G.legsWon.join(' – ')}`;
    const ls=G.legsHist[G.legsHist.length-1];let rec='';
    if(ls&&ls.avg)rec=`<p>${t('legAvg')}: ${G.players.map((p,i)=>esc(p.name)+' '+(ls.avg[i]?nf(ls.avg[i],1):'–')).join(', ')}.</p>`;
    if(ls&&ls.mpr)rec=`<p>${t('legMpr')}: ${G.players.map((p,i)=>esc(p.name)+' '+nf(ls.mpr[i],2)).join(', ')}.</p>`;
    const det=!n.detail?'':typeof n.detail==='string'?n.detail:n.detail.k==='shanghai'?'Shanghai!':t(n.detail.k,...n.detail.a);
    showModal(`<h3>${t('legTo',n.set,nm)}</h3><p>${esc(det)}${det?'. ':''}${G.players.length>1?sc+'.':''}</p>${rec}<p>${t('throwsFirst',esc(pname(G.turn)))}</p><button class="btn primary" data-act="noticeok">${t('cont')}</button><button class="btn" data-act="undo">${t('undoLast')}</button>`);}
  if(V.name==='game'&&G&&G.bulloff&&!G.finished&&document.getElementById('modal').hidden)
    ask(t('bullQ'),'',G.players.map((pl,i)=>({v:i,l:esc(pl.name)})),i=>{G.legStarter=G.setStarter=G.turn=i;G.bulloff=false;if(G.mode==='x01'){G.visitStart=G.rem[i];G.visitOpen=G.opened[i]}saveGame();render()});
  scheduleCpu();
}

/* ---------- actions ---------- */
function addPlayer(){
  const el=document.getElementById('newp');const name=(el&&el.value||'').trim();if(!name){el&&el.focus();return}
  if(DB.players.some(p=>p.name.toLowerCase()===name.toLowerCase())){toast(t('dupName'));return}
  const p={id:uid(),name};DB.players.push(p);save();
  if(V.name==='setup'){if(SETUP.players.length<MAXP-(SETUP.cpu.on?1:0))SETUP.players.push(p.id);saveSetup()}
  const inPicker=!document.getElementById('modal').hidden;render();
  if(inPicker&&V.name==='setup')openPicker(true);else{const n=document.getElementById('newp');n&&n.focus()}
}
function saveSetup(){DB.settings.setup=SETUP;save()}
function setPath(obj,path,val){const k=path.split('.');let o=obj;while(k.length>1)o=o[k.shift()];o[k[0]]=val}
function getPath(obj,path){return path.split('.').reduce((o,k)=>o[k],obj)}
function startMatch(){
  const s=SETUP;
  const plist=s.players.map(id=>({id,name:DB.players.find(p=>p.id===id).name}));
  if(s.cpu.on)plist.push({id:'cpu',name:cpuName(),cpu:true,level:s.cpu.level});
  const teams=s.teams&&(s.mode==='x01'||s.mode==='cricket')&&plist.length===4&&!s.cpu.on;
  const go2=()=>{newMatch({mode:s.mode,plist,random:s.random,teams,bulloff:s.bulloff&&!s.random,hcp:s.mode==='x01'&&s.x01.hcpOn&&!teams?s.x01.hcp:null,opts:Object.assign({},s[s.mode],s.mode==='atc'?{bull:!!s.atc.bull}:{})});saveGame();NAV=[{name:'home'}];V={name:'game'};render()};
  if(G&&!G.finished)confirmBox(t('inProg'),t('inProgTxt'),t('startAnyway'),go2,true);else go2();
}
function totOk(){
  const tv=parseInt(PAD.typed||'0',10);PAD.typed='';
  if(tv>180||IMPOSSIBLE.includes(tv)){toast(t('cantScore',tv));render();return}
  const p=G.turn,o=G.opts,rem=G.visitStart,nr=rem-tv;
  const isCo=nr===0&&checkout(rem,3,o.outMode)&&(G.opened[p]||o.inMode==='single'||tv>0);
  if(isCo){
    const min=[1,2,3].find(d=>checkout(rem,d,o.outMode));
    const pickDbl=used=>{if(o.outMode==='single')return x01Total(tv,used,0);if(used===1)return x01Total(tv,1,1);
      ask(t('atDbl'),t('atDblQ'),[...Array(used)].map((_,i)=>({v:i+1,l:i+1})),d=>x01Total(tv,used,d))};
    if(min===3)return pickDbl(3);
    return ask(t('coTitle',tv),t('coDarts'),[1,2,3].filter(d=>d>=min).map(d=>({v:d,l:d})),pickDbl);
  }
  if(o.outMode!=='single'&&G.opened[p]&&checkout(rem,3,o.outMode)&&nr<=50)
    return ask(t('atDbl'),t('atDblQ'),[0,1,2,3].map(d=>({v:d,l:d})),d=>x01Total(tv,3,d));
  x01Total(tv,3,0);
}
function importText(txt){ACT._import(txt)}
const ACT={
  go:d=>go(d.v),back:()=>back(),home:()=>{NAV=[];V={name:'home'};render()},
  resume:()=>{NAV=[{name:'home'}];V={name:'game'};render()},
  mode:d=>{SETUP.mode=d.v;saveSetup();render()},
  opt:d=>{let v=d.v;if(/^\d+$/.test(v))v=+v;if(d.k.startsWith('s.')){DB.settings[d.k.slice(2)]=v;save();applyTheme();applyLang()}else{setPath(SETUP,d.k,v);saveSetup()}render()},
  step:d=>{const cur=getPath(SETUP,d.k);const v=Math.max(1,Math.min(d.k==='cpu.level'?10:d.k.endsWith('sets')?7:11,cur+(+d.d)));setPath(SETUP,d.k,v);saveSetup();render()},
  pick:d=>{const i=SETUP.players.indexOf(d.v);if(i>=0)SETUP.players.splice(i,1);else SETUP.players.push(d.v);saveSetup();render()},
  picker:()=>openPicker(false),
  ppick:d=>{const i=SETUP.players.indexOf(d.v);if(i>=0)SETUP.players.splice(i,1);else if(SETUP.players.length<MAXP-(SETUP.cpu.on?1:0))SETUP.players.push(d.v);saveSetup();render();openPicker(false)},
  pdone:()=>{closeModal();render()},
  pmove:d=>{const a=SETUP.players,i=a.indexOf(d.v);if(i>0){[a[i-1],a[i]]=[a[i],a[i-1]];saveSetup();render()}},
  rnd:()=>{SETUP.random=!SETUP.random;saveSetup();render()},
  cpu:()=>{if(!SETUP.cpu.on&&SETUP.players.length>=MAXP){toast(t('maxPlayers',MAXP));return}SETUP.cpu.on=!SETUP.cpu.on;saveSetup();render()},
  cpuname:()=>promptBox(t('oppName'),cpuName(),v=>{if(DB.players.some(p=>p.name.toLowerCase()===v.toLowerCase())){toast(t('dupName'));return}SETUP.cpu.name=v;saveSetup();render()}),
  cpuauto:()=>{SETUP.cpu.name='';saveSetup();render()},
  addp:addPlayer,start:startMatch,
  mul:d=>{const m=+d.v;PAD.mul=PAD.mul===m?1:m;render()},
  missrest:()=>missRest(),
  num:d=>dart(+d.v,PAD.mul),bull:()=>dart(25,2),miss:()=>{dart(0,0);if(!LS.get('missTip',false)){LS.set('missTip',true);toast(t('missTip'))}},undo:()=>{closeModal();undo()},
  inmode:()=>{G.input=G.input==='total'?'dart':'total';if(G.visit.length&&G.input==='total'){G.input='dart';toast(t('finishVisit'));return}PAD.typed='';saveGame();render()},
  digit:d=>{if(PAD.typed.length<3)PAD.typed=(PAD.typed==='0'?'':PAD.typed)+d.v;render()},
  del:()=>{PAD.typed=PAD.typed.slice(0,-1);render()},
  quick:d=>{PAD.typed=String(d.v);totOk()},totok:totOk,
  bob:d=>bobHits(+d.v),
  noticeok:()=>{G.notice=null;closeModal();saveGame();render()},
  askpick:d=>{const cb=ASKCB;closeModal();cb&&cb(+d.v)},
  closemodal:()=>closeModal(),
  promptok:()=>{const v=document.getElementById('pin').value.trim();const cb=ASKCB;closeModal();if(v&&cb)cb(v)},
  rematch:()=>{const pl=G.players.map(p=>p.cpu?p:Object.assign({},p,{name:(DB.players.find(x=>x.id===p.id)||p).name}));pl.push(pl.shift());newMatch({mode:G.mode,plist:pl,random:false,opts:G.opts});saveGame();V={name:'game'};NAV=[{name:'home'}];render()},
  abandon:()=>confirmBox(t('abandonQ'),t('abandonTxt'),t('abandon'),()=>{stopCpu();G=null;UNDO=[];PAD.typed='';saveGame();NAV=[];V={name:'home'};render();toast(t('abandoned'))},true),
  mstats:()=>go('mstats'),
  match:d=>go('match',d.v),
  delmatch:d=>confirmBox(t('delMatchQ'),t('delMatchTxt'),t('del'),()=>{DB.history=DB.history.filter(h=>h.id!==d.v);save();back()},true),
  renp:d=>{const p=DB.players.find(x=>x.id===d.v);promptBox(t('renamePlayer'),p.name,v=>{p.name=v;DB.history.forEach(h=>h.players.forEach(q=>{if(q.id===p.id)q.name=v}));if(G)G.players.forEach(q=>{if(q.id===p.id)q.name=v});save();saveGame();render()})},
  delp:d=>{const p=DB.players.find(x=>x.id===d.v);confirmBox(t('delPlayerQ',esc(p.name)),t('delPlayerTxt'),t('del'),()=>{DB.players=DB.players.filter(x=>x.id!==d.v);SETUP.players=SETUP.players.filter(x=>x!==d.v);saveSetup();save();render()},true)},
  statp:d=>{STATP=d.v;render()},
  hfilt:d=>{HFILT=d.v;render()},
  tset:d=>{DB.settings[d.v]=!DB.settings[d.v];save();render()},
  teams:()=>{SETUP.teams=!SETUP.teams;saveSetup();render()},
  hcpon:()=>{SETUP.x01.hcpOn=!SETUP.x01.hcpOn;saveSetup();render()},
  bulloff:()=>{SETUP.bulloff=!SETUP.bulloff;saveSetup();render()},
  editv:d=>editVisit(+d.v),
  drill:d=>{const pid=SETUP.trp&&DB.players.some(p=>p.id===SETUP.trp)?SETUP.trp:(DB.players[0]||{}).id;if(!pid)return;
    const pl=[{id:pid,name:DB.players.find(p=>p.id===pid).name}],v=d.v;
    const go2=()=>{if(v==='atc'||v==='bobs')newMatch({mode:v,plist:pl,opts:Object.assign({},SETUP[v],v==='atc'?{bull:!!SETUP.atc.bull}:{})});else newMatch({mode:'drill',plist:pl,opts:{drill:v,tgt:SETUP.tgt||'T20'}});saveGame();NAV=[{name:'home'}];V={name:'game'};render()};
    if(G&&!G.finished)confirmBox(t('inProg'),t('inProgTxt'),t('startAnyway'),go2,true);else go2()},
  upd:()=>{const u=`https://github.com/${REPO}/releases/latest/download/darts.apk`;UPD=null;render();location.href=u},
  updcheck:()=>{toast(t('updChecking'));checkUpdate(true)},
  updlater:()=>{if(UPD)LS.set('updskip',UPD.v);UPD=null;render()},
  bkfile:()=>backupFile(),
  bkopen:()=>{const f=document.getElementById('bkfile');if(f){f.value='';f.click()}},
  export:async()=>{const data=JSON.stringify({app:'darts',v:1,players:DB.players,history:DB.history});const ta=document.getElementById('bk');ta.value=data;
    try{await navigator.clipboard.writeText(data);toast(t('copied'))}catch(e){ta.select();try{document.execCommand('copy');toast(t('copied'))}catch(e2){toast(t('copyBox'))}}},
  import:()=>importText(document.getElementById('bk').value.trim()),
  _import:txt=>{try{const raw=JSON.parse(txt);/* 'freccette' = backups made by the first prototype */if(!['darts','freccette'].includes(raw.app)||!Array.isArray(raw.players)||!Array.isArray(raw.history))throw 0;const d=cleanBackup(raw);
    confirmBox(t('restoreQ'),t('restoreTxt',d.players.length,d.history.length),t('restore'),()=>{DB.players=d.players;DB.history=d.history;save();SETUP=getSetup();toast(t('restored'));render()},true)}catch(e){toast(t('badBk'))}},
  wipe:()=>confirmBox(t('wipeQ'),t('wipeTxt'),t('wipeAll'),()=>{DB.players=[];DB.history=[];G=null;UNDO=[];DB.settings.setup=null;SETUP=getSetup();save();saveGame();toast(t('wiped'));render()},true)
};
/* long press: [data-long] runs its own action after 450 ms; the click that follows is ignored */
let LP=null,LPT=0,LPA='';
document.addEventListener('pointerdown',e=>{LPA='';const b=e.target.closest('[data-long]');if(!b||b.disabled)return;clearTimeout(LP);
  LP=setTimeout(()=>{LPT=Date.now();LPA=b.dataset.act;vib(true);const f=ACT[b.dataset.long];f&&f(b.dataset,b)},450)});
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>clearTimeout(LP),true));
document.addEventListener('contextmenu',e=>{if(e.target.closest('.k'))e.preventDefault()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;if(b.dataset.act===LPA&&Date.now()-LPT<800){LPA='';return}const f=ACT[b.dataset.act];if(!f)return;
  if(b.closest('.pad')||b.closest('.opts'))vib();f(b.dataset,b)});
document.addEventListener('input',e=>{if(e.target.id==='psearch')filterPicker()});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset&&el.dataset.h2h!=null){H2H[+el.dataset.h2h]=el.value;render()}
  else if(el.dataset&&el.dataset.hcp){SETUP.x01.hcp[el.dataset.hcp]=+el.value;saveSetup()}
  else if(el.id==='trp'){SETUP.trp=el.value;saveSetup()}
  else if(el.id==='bkfile'&&el.files&&el.files[0])el.files[0].text().then(importText).catch(()=>toast(t('badBk')));
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='newp'){e.preventDefault();addPlayer();return}
  if(e.key==='Enter'&&e.target.id==='pin'){e.preventDefault();ACT.promptok();return}
  if(e.key==='Escape'&&!document.getElementById('modal').hidden){closeModal();return}
  if(V.name==='game'&&G&&!G.finished&&!G.players[G.turn].cpu&&G.mode==='x01'&&G.input==='total'&&document.getElementById('modal').hidden&&!/INPUT|TEXTAREA/.test(e.target.tagName)){
    if(/^\d$/.test(e.key))ACT.digit({v:e.key});else if(e.key==='Backspace')ACT.del();else if(e.key==='Enter')totOk();}
});
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal'&&!(G&&G.notice&&V.name==='game'))closeModal()});

/* Android back button (Capacitor) */
try{const A=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.App;
  if(A)A.addListener('backButton',()=>{if(!document.getElementById('modal').hidden&&!(G&&G.notice)){closeModal();return}
    if(V.name==='home')A.exitApp();else if(V.name==='results'){NAV=[];V={name:'home'};render()}else back()})}catch(e){}

(async()=>{
  await restoreFromPreferences();loadAll();applyLang();applyTheme();
  setTimeout(()=>checkUpdate(),1500);
  try{const A=CAP('App');if(A)A.addListener('resume',()=>checkUpdate())}catch(e){}
  if(G&&G.finished){G=null;saveGame()}
  render();
})();
</script>
